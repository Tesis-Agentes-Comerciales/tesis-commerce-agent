[project]
name = "tesis-commerce-agent"
version = "0.1.0"
description = "Buyer agent that interacts with an external ecommerce service through ACP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ap2 @ git+https://github.com/google-agentic-commerce/AP2.git@e1ea56db72a6385bce3e5c1112b3a56ce60acb43",
  "assistant-stream>=0.0.36,<0.0.37",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.25,<5",
  "langchain-core>=1.6.4,<2",
  "langgraph>=1.2.12,<2",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
  "openai>=2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "referencing>=0.36,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "langgraph-cli[inmem]>=0.4,<1",
  "playwright>=1.58,<2",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.12,<1",
  # Experiments live in their own workspace member, outside the product wheel and image.
  "tesis-commerce-evaluation",
]

[tool.uv.workspace]
members = ["evaluation"]

[tool.uv.sources]
tesis-commerce-evaluation = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_agent"]

[tool.hatch.build.targets.wheel.force-include]
# D1 provenance verifies installed dependency versions against the lock it was built with.
"uv.lock" = "commerce_agent/uv.lock"

[tool.hatch.build.targets.sdist]
exclude = ["/evaluation", "/tests/evaluation"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
# tests/conftest.py applies live and evaluation by directory; see docs/testing.md.
markers = [
  "live: layer 4, real Merchant, payment provider and Docker PostgreSQL (tests/integration); skipped unless RUN_LIVE_STACK=1",
  "slow: over ~20 s per test; deselect with -m 'not slow' for a quick live subset",
  "evaluation: layer 5 in dry-run, the evaluation harnesses without models or network (tests/evaluation)",
]

[tool.coverage.run]
source_pkgs = ["commerce_agent", "commerce_evaluation"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.pyright]
include = ["src", "evaluation/src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "src", "evaluation/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
