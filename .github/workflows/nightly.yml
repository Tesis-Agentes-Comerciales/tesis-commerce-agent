name: Nightly system tests

# Layer 4 (docs/testing.md): the live suite across Agent, Merchant and payment provider.
# Replaces live-stack.yml and joint-e2e.yml; the mocked UI E2E runs on every PR in ci.yml.
on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Required historical-service baseline (full or P2 only)
        required: false
        type: choice
        default: full
        options:
          - full
          - p0-catalog-bridge
      merchant_ref:
        description: Must resolve to the historical Merchant pin; empty uses that pin
        required: false
        type: string
        default: abf30df3b6a611284dedcc26c00accac6a853329
      payment_ref:
        description: Must resolve to the historical PSP pin; empty uses that pin
        required: false
        type: string
        default: e6ab67b5963434a9a3caae2012b70232a3cca65d
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sibling-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      available: ${{ steps.token.outputs.available }}
    steps:
      # Merchant and payment provider are private repositories; GITHUB_TOKEN cannot read them.
      # Every scheduled/manual live invocation is required. No skipped green workflow.
      - name: Check sibling read token
        id: token
        env:
          SIBLING_TOKEN_CONFIGURED: ${{ secrets.MERCHANT_REPO_TOKEN != '' }}
        run: |
          if [ "$SIBLING_TOKEN_CONFIGURED" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Nightly not executed::Required sibling read credential is missing; no live validation occurred."
            exit 1
          fi

  live-stack:
    needs: sibling-access
    if: needs.sibling-access.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout buyer agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: agent
          persist-credentials: false

      - name: Checkout merchant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tesis-Agentes-Comerciales/tesis-commerce-merchant
          ref: ${{ inputs.merchant_ref || 'abf30df3b6a611284dedcc26c00accac6a853329' }}
          token: ${{ secrets.MERCHANT_REPO_TOKEN }}
          path: merchant
          persist-credentials: false

      - name: Checkout payment provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tesis-Agentes-Comerciales/tesis-payment-provider-sandbox
          ref: ${{ inputs.payment_ref || 'e6ab67b5963434a9a3caae2012b70232a3cca65d' }}
          token: ${{ secrets.MERCHANT_REPO_TOKEN }}
          path: payment
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          (cd agent && uv python install && uv sync --frozen --all-groups)
          (cd merchant && uv python install && uv sync --frozen --all-groups)
          (cd payment && uv python install && uv sync --frozen --all-groups)

      - name: Verify pinned baseline before starting services
        working-directory: agent
        env:
          MERCHANT_REPO: ${{ github.workspace }}/merchant
          PAYMENT_REPO: ${{ github.workspace }}/payment
        run: >-
          uv run python -m tests.support.nightly_evidence --preflight
          --scope "${{ inputs.test_scope || 'full' }}"
          --output "$RUNNER_TEMP/nightly-manifest.json"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            agent/auth/package-lock.json
            agent/ui/package-lock.json

      # The browser test drives auth/ and ui/ with the Agent's own pinned Playwright.
      - name: Install auth, UI and Chromium
        working-directory: agent
        run: |
          (cd auth && npm ci)
          (cd ui && npm ci)
          uv run playwright install --with-deps --only-shell chromium

      # Disposable PostgreSQL in Docker, the real Merchant and payment provider, and the
      # Agent with its UI; see docs/testing.md and tests/integration/README.md.
      - name: Run live suite
        working-directory: agent
        env:
          RUN_LIVE_STACK: "1"
          TEST_PATH: ${{ inputs.test_scope == 'p0-catalog-bridge' && 'tests/integration/test_live_p0_catalog_bridge.py' || 'tests/integration' }}
          MERCHANT_REPO: ${{ github.workspace }}/merchant
          PAYMENT_REPO: ${{ github.workspace }}/payment
        run: >-
          uv run pytest "$TEST_PATH" -rs -p no:cacheprovider
          --basetemp="$RUNNER_TEMP/live-stack"
          --junitxml="$RUNNER_TEMP/live-junit.xml"
          -p commerce_evaluation.p0_pytest_report
          --p0-report="$RUNNER_TEMP/live-outcomes.json"

      - name: Require complete live evidence
        if: ${{ !cancelled() }}
        working-directory: agent
        run: >-
          uv run python -m tests.support.nightly_evidence
          --scope "${{ inputs.test_scope || 'full' }}"
          --manifest "$RUNNER_TEMP/nightly-manifest.json"
          --junit "$RUNNER_TEMP/live-junit.xml"
          --outcomes "$RUNNER_TEMP/live-outcomes.json"
          --evidence "$RUNNER_TEMP/live-stack"
          --output "$RUNNER_TEMP/nightly-report.json"

      # Evidence, service logs, the browser screenshot and the JUnit report; workers never
      # log tokens or bodies.
      - name: Upload live evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ inputs.test_scope || 'full' }}-evidence
          path: |
            ${{ runner.temp }}/live-stack/**/*.jsonl
            ${{ runner.temp }}/live-stack/**/*.log
            ${{ runner.temp }}/live-stack/**/*.png
            ${{ runner.temp }}/live-junit.xml
            ${{ runner.temp }}/live-outcomes.json
            ${{ runner.temp }}/nightly-manifest.json
            ${{ runner.temp }}/nightly-report.json
            ${{ runner.temp }}/nightly-SHA256SUMS
          if-no-files-found: error
          retention-days: 14
