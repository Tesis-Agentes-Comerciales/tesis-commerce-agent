name: Nightly system tests

# Layer 4 (docs/testing.md): the live suite across Agent, Merchant and payment provider.
# Replaces live-stack.yml and joint-e2e.yml; the mocked UI E2E runs on every PR in ci.yml.
on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Full regression suite or preregistered experimental batch (separate evidence)
        required: false
        type: choice
        default: full
        options:
          - full
          - exp01-first-batch
          - exp02-commercial
          - exp03-stock-shipping
          - exp04-mandate-replacement
          - exp05-ct15-hnp
          - exp05-authenticated-transport
          - exp06-hp-infrastructure
          - exp06-runner-infrastructure
          - exp07-ct19-fixture
          - exp07-ct19-hp
          - exp06-actions-validation
      experimental_scenario:
        description: Experimental profile only; validate one scenario before expanding
        required: false
        type: choice
        default: CT15
        options: [CT15, CT14, CT13, CT16, MA22, MA23]
      merchant_ref:
        description: Merchant branch or commit (empty uses its default branch)
        required: false
        type: string
      payment_ref:
        description: Payment-provider branch or commit (empty uses its default branch)
        required: false
        type: string
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exp06-actions-validation:
    if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'exp06-actions-validation'
    uses: ./.github/workflows/exp06-smoke.yml
    with:
      agent_sha: ${{ github.sha }}
    secrets:
      MERCHANT_REPO_TOKEN: ${{ secrets.MERCHANT_REPO_TOKEN }}

  sibling-access:
    if: inputs.test_scope != 'exp06-actions-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      available: ${{ steps.token.outputs.available }}
    steps:
      # Merchant and payment provider are private repositories; GITHUB_TOKEN cannot read them.
      # Without a read-only token for both, the live job is skipped with a notice.
      - name: Check sibling read token
        id: token
        env:
          MERCHANT_REPO_TOKEN: ${{ secrets.MERCHANT_REPO_TOKEN }}
        run: |
          if [ -n "$MERCHANT_REPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.test_scope }}" == exp0* ]]; then
              echo "::error::EXP-01 blocked: required sibling read credential missing"
              exit 1
            fi
            echo "::notice title=Live stack skipped::Secret MERCHANT_REPO_TOKEN is not configured. Add a read-only token (contents: read) for Tesis-Agentes-Comerciales/tesis-commerce-merchant and Tesis-Agentes-Comerciales/tesis-payment-provider-sandbox to run tests/integration."
          fi

  live-stack:
    needs: sibling-access
    if: ${{ !cancelled() && inputs.test_scope != 'exp06-actions-validation' && (startsWith(inputs.test_scope, 'exp0') || needs.sibling-access.outputs.available == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout buyer agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: agent
          fetch-depth: 0
          persist-credentials: false

      - name: Require access for EXP-01
        if: startsWith(inputs.test_scope, 'exp0')
        env:
          ACCESS: ${{ needs.sibling-access.outputs.available }}
        run: test "$ACCESS" = "true"

      - name: Checkout merchant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tesis-Agentes-Comerciales/tesis-commerce-merchant
          ref: ${{ inputs.merchant_ref || (startsWith(inputs.test_scope, 'exp0') && 'abf30df3b6a611284dedcc26c00accac6a853329') || '' }}
          token: ${{ secrets.MERCHANT_REPO_TOKEN }}
          path: merchant
          persist-credentials: false

      - name: Checkout payment provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tesis-Agentes-Comerciales/tesis-payment-provider-sandbox
          ref: ${{ inputs.payment_ref || (startsWith(inputs.test_scope, 'exp0') && 'e6ab67b5963434a9a3caae2012b70232a3cca65d') || '' }}
          token: ${{ secrets.MERCHANT_REPO_TOKEN }}
          path: payment
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          (cd agent && uv python install && uv sync --frozen --all-groups)
          (cd merchant && uv python install && uv sync --frozen --all-groups)
          (cd payment && uv python install && uv sync --frozen --all-groups)

      - name: Install Node.js
        if: ${{ !startsWith(inputs.test_scope, 'exp0') || inputs.test_scope == 'exp05-authenticated-transport' || inputs.test_scope == 'exp06-hp-infrastructure' || inputs.test_scope == 'exp06-runner-infrastructure' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            agent/auth/package-lock.json
            agent/ui/package-lock.json

      - name: Install auth for authenticated adapter validation
        if: inputs.test_scope == 'exp05-authenticated-transport' || inputs.test_scope == 'exp06-hp-infrastructure' || inputs.test_scope == 'exp06-runner-infrastructure'
        working-directory: agent/auth
        run: npm ci

      # The browser test drives auth/ and ui/ with the Agent's own pinned Playwright.
      - name: Install auth, UI and Chromium
        if: ${{ !startsWith(inputs.test_scope, 'exp0') }}
        working-directory: agent
        run: |
          (cd auth && npm ci)
          (cd ui && npm ci)
          uv run playwright install --with-deps --only-shell chromium

      - name: Verify EXP-01 preregistration and exact sources
        if: startsWith(inputs.test_scope, 'exp0')
        working-directory: agent
        env:
          PYTHONPATH: evaluation/src
          MERCHANT_REPO: ${{ github.workspace }}/merchant
          PAYMENT_REPO: ${{ github.workspace }}/payment
        run: |
          protocol=evaluation/scenarios/exp01-first-batch.json
          if [ "${{ inputs.test_scope }}" = "exp07-ct19-hp" ]; then
            protocol=evaluation/scenarios/ct19-hp.json
          fi
          if [ "${{ inputs.test_scope }}" = "exp07-ct19-fixture" ]; then
            protocol=evaluation/scenarios/ct19-fixture.json
          fi
          if [ "${{ inputs.test_scope }}" = "exp02-commercial" ]; then
            protocol=evaluation/scenarios/exp02-commercial.json
          elif [ "${{ inputs.test_scope }}" = "exp03-stock-shipping" ]; then
            protocol=evaluation/scenarios/exp03-stock-shipping.json
          elif [ "${{ inputs.test_scope }}" = "exp04-mandate-replacement" ]; then
            protocol=evaluation/scenarios/exp04-mandate-replacement.json
          elif [ "${{ inputs.test_scope }}" = "exp05-ct15-hnp" ]; then
            protocol=evaluation/scenarios/exp05-ct15-hnp.json
          elif [ "${{ inputs.test_scope }}" = "exp05-authenticated-transport" ]; then
            protocol=evaluation/scenarios/exp05-authenticated-transport.json
          elif [ "${{ inputs.test_scope }}" = "exp06-hp-infrastructure" ]; then
            protocol=evaluation/scenarios/exp06-hp-infrastructure.json
          elif [ "${{ inputs.test_scope }}" = "exp06-runner-infrastructure" ]; then
            protocol=evaluation/scenarios/exp06-runner-infrastructure.json
          fi
          python3 -m commerce_evaluation.exp01 --preflight --protocol "$protocol" \
            --output "$RUNNER_TEMP/exp01-manifest.json"

      # Disposable PostgreSQL in Docker, the real Merchant and payment provider, and the
      # Agent with its UI; see docs/testing.md and tests/integration/README.md.
      - name: Run live suite
        working-directory: agent
        env:
          RUN_LIVE_STACK: "1"
          MERCHANT_REPO: ${{ github.workspace }}/merchant
          PAYMENT_REPO: ${{ github.workspace }}/payment
        run: |
          if [ "${{ inputs.test_scope }}" = "exp07-ct19-hp" ]; then
            uv run pytest tests/integration/test_ct19_hp.py -vv --durations=20 -p no:cacheprovider \
              --basetemp="$RUNNER_TEMP/exp01-stack" --junitxml="$RUNNER_TEMP/exp01-junit.xml" \
              -p commerce_evaluation.p0_pytest_report --p0-report="$RUNNER_TEMP/exp01-outcomes.json"
          elif [ "${{ inputs.test_scope }}" = "exp07-ct19-fixture" ]; then
            uv run pytest tests/integration/test_ct19_fixture.py -vv --durations=20 -p no:cacheprovider \
              --basetemp="$RUNNER_TEMP/exp01-stack" --junitxml="$RUNNER_TEMP/exp01-junit.xml" \
              -p commerce_evaluation.p0_pytest_report --p0-report="$RUNNER_TEMP/exp01-outcomes.json"
          elif [ "${{ inputs.test_scope }}" = "exp01-first-batch" ]; then
            uv run pytest tests/integration/test_exp01_first_batch.py -vv --durations=20 -p no:cacheprovider \
              --basetemp="$RUNNER_TEMP/exp01-stack" --junitxml="$RUNNER_TEMP/exp01-junit.xml" \
              -p commerce_evaluation.p0_pytest_report --p0-report="$RUNNER_TEMP/exp01-outcomes.json"
          elif [ "${{ inputs.test_scope }}" = "exp02-commercial" ]; then
            case "${{ inputs.experimental_scenario }}" in
              CT15) target=test_ct15_price_change ;;
              CT14) target=test_ct14_stock_after_checkout ;;
              *) echo "::error::Unknown required scenario"; exit 1 ;;
            esac
            uv run pytest "tests/integration/test_exp02_commercial.py::$target" -vv --durations=20 -p no:cacheprovider \
              --basetemp="$RUNNER_TEMP/exp01-stack" --junitxml="$RUNNER_TEMP/exp01-junit.xml" \
              -p commerce_evaluation.p0_pytest_report --p0-report="$RUNNER_TEMP/exp01-outcomes.json"
          elif [ "${{ inputs.test_scope }}" = "exp03-stock-shipping" ]; then
            case "${{ inputs.experimental_scenario }}" in
              CT13) target=test_ct13_stock_after_consent ;;
              CT16) target=test_ct16_shipping_after_checkout ;;
              *) echo "::error::Unknown required scenario"; exit 1 ;;
            esac
            uv run pytest "tests/integration/test_exp03_stock_shipping.py::$target" -vv --durations=20 -p no:cacheprovider \
              --basetemp="$RUNNER_TEMP/exp01-stack" --junitxml="$RUNNER_TEMP/exp01-junit.xml" \
              -p commerce_evaluation.p0_pytest_report --p0-report="$RUNNER_TEMP/exp01-outcomes.json"
          elif [ "${{ inputs.test_scope }}" = "exp04-mandate-replacement" ]; then
            case "${{ inputs.experimental_scenario }}" in
              MA22|MA23) target="test_replace_grant_before_trigger[${{ inputs.experimental_scenario }}]" ;;
              *) echo "::error::Unknown required scenario"; exit 1 ;;
            esac
            uv run pytest "tests/integration/test_exp04_mandate_replacement.py::$target" -vv --durations=20 -p no:cacheprovider \
              --basetemp="$RUNNER_TEMP/exp01-stack" --junitxml="$RUNNER_TEMP/exp01-junit.xml" \
              -p commerce_evaluation.p0_pytest_report --p0-report="$RUNNER_TEMP/exp01-outcomes.json"
          elif [ "${{ inputs.test_scope }}" = "exp05-ct15-hnp" ]; then
            uv run pytest tests/integration/test_exp05_ct15_hnp.py -vv --durations=20 -p no:cacheprovider \
              --basetemp="$RUNNER_TEMP/exp01-stack" --junitxml="$RUNNER_TEMP/exp01-junit.xml" \
              -p commerce_evaluation.p0_pytest_report --p0-report="$RUNNER_TEMP/exp01-outcomes.json"
          elif [ "${{ inputs.test_scope }}" = "exp05-authenticated-transport" ]; then
            uv run pytest tests/integration/test_exp05_authenticated_ux.py -vv --durations=20 -p no:cacheprovider \
              --basetemp="$RUNNER_TEMP/exp01-stack" --junitxml="$RUNNER_TEMP/exp01-junit.xml" \
              -p commerce_evaluation.p0_pytest_report --p0-report="$RUNNER_TEMP/exp01-outcomes.json"
          elif [ "${{ inputs.test_scope }}" = "exp06-hp-infrastructure" ]; then
            uv run pytest tests/integration/test_exp06_hp_infrastructure.py -vv --durations=20 -p no:cacheprovider \
              --basetemp="$RUNNER_TEMP/exp01-stack" --junitxml="$RUNNER_TEMP/exp01-junit.xml" \
              -p commerce_evaluation.p0_pytest_report --p0-report="$RUNNER_TEMP/exp01-outcomes.json"
          elif [ "${{ inputs.test_scope }}" = "exp06-runner-infrastructure" ]; then
            uv run pytest tests/integration/test_exp06_runner_infrastructure.py -vv --durations=20 -p no:cacheprovider \
              --basetemp="$RUNNER_TEMP/exp01-stack" --junitxml="$RUNNER_TEMP/exp01-junit.xml" \
              -p commerce_evaluation.p0_pytest_report --p0-report="$RUNNER_TEMP/exp01-outcomes.json"
          else
            uv run pytest tests/integration --ignore=tests/integration/test_ct19_hp.py --ignore=tests/integration/test_ct19_fixture.py --ignore=tests/integration/test_exp01_first_batch.py --ignore=tests/integration/test_exp02_commercial.py --ignore=tests/integration/test_exp03_stock_shipping.py --ignore=tests/integration/test_exp04_mandate_replacement.py --ignore=tests/integration/test_exp05_ct15_hnp.py --ignore=tests/integration/test_exp05_authenticated_ux.py --ignore=tests/integration/test_exp06_hp_infrastructure.py --ignore=tests/integration/test_exp06_runner_infrastructure.py -rs -p no:cacheprovider \
              --basetemp="$RUNNER_TEMP/live-stack" --junitxml="$RUNNER_TEMP/live-junit.xml"
          fi

      - name: Require complete EXP-01 observations and cleanup
        if: ${{ !cancelled() && startsWith(inputs.test_scope, 'exp0') }}
        working-directory: agent
        env:
          PYTHONPATH: evaluation/src
        run: |
          reporter=python3
          if [ -x .venv/bin/python ]; then reporter=.venv/bin/python; fi
          args=()
          if [ "${{ inputs.test_scope }}" = "exp07-ct19-hp" ]; then
            args+=(--protocol evaluation/scenarios/ct19-hp.json)
          fi
          if [ "${{ inputs.test_scope }}" = "exp07-ct19-fixture" ]; then
            args+=(--protocol evaluation/scenarios/ct19-fixture.json --scenario CT19-FIXTURE)
          fi
          if [ "${{ inputs.test_scope }}" = "exp02-commercial" ]; then
            args+=(--protocol evaluation/scenarios/exp02-commercial.json --scenario "${{ inputs.experimental_scenario }}")
          elif [ "${{ inputs.test_scope }}" = "exp03-stock-shipping" ]; then
            args+=(--protocol evaluation/scenarios/exp03-stock-shipping.json --scenario "${{ inputs.experimental_scenario }}")
          elif [ "${{ inputs.test_scope }}" = "exp04-mandate-replacement" ]; then
            args+=(--protocol evaluation/scenarios/exp04-mandate-replacement.json --scenario "${{ inputs.experimental_scenario }}")
          elif [ "${{ inputs.test_scope }}" = "exp05-ct15-hnp" ]; then
            args+=(--protocol evaluation/scenarios/exp05-ct15-hnp.json --scenario CT15)
          elif [ "${{ inputs.test_scope }}" = "exp05-authenticated-transport" ]; then
            args+=(--protocol evaluation/scenarios/exp05-authenticated-transport.json --scenario AUTH-TRANSPORT)
          elif [ "${{ inputs.test_scope }}" = "exp06-hp-infrastructure" ]; then
            args+=(--protocol evaluation/scenarios/exp06-hp-infrastructure.json --scenario EXP06-INFRA)
          elif [ "${{ inputs.test_scope }}" = "exp06-runner-infrastructure" ]; then
            args+=(--protocol evaluation/scenarios/exp06-runner-infrastructure.json --scenario EXP06-INFRA)
          fi
          "$reporter" -m commerce_evaluation.exp01 "${args[@]}" \
            --evidence "$RUNNER_TEMP/exp01-stack" --junit "$RUNNER_TEMP/exp01-junit.xml" \
            --outcomes "$RUNNER_TEMP/exp01-outcomes.json" --manifest "$RUNNER_TEMP/exp01-manifest.json" \
            --output "$RUNNER_TEMP/exp01-report.json"

      # Evidence, service logs, the browser screenshot and the JUnit report; workers never
      # log tokens or bodies.
      - name: Upload live evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.test_scope == 'exp07-ct19-hp' && 'ct19-hp-evidence' || inputs.test_scope == 'exp07-ct19-fixture' && 'ct19-fixture-evidence' || inputs.test_scope == 'exp06-runner-infrastructure' && 'exp06-runner-infrastructure-evidence' || inputs.test_scope == 'exp06-hp-infrastructure' && 'exp06-hp-infrastructure-evidence' || inputs.test_scope == 'exp05-authenticated-transport' && 'exp05-authenticated-transport-evidence' || inputs.test_scope == 'exp05-ct15-hnp' && 'exp05-ct15-hnp-evidence' || inputs.test_scope == 'exp04-mandate-replacement' && format('exp04-{0}-evidence', inputs.experimental_scenario) || inputs.test_scope == 'exp03-stock-shipping' && format('exp03-{0}-evidence', inputs.experimental_scenario) || inputs.test_scope == 'exp02-commercial' && format('exp02-{0}-evidence', inputs.experimental_scenario) || inputs.test_scope == 'exp01-first-batch' && 'exp01-first-batch-evidence' || 'live-stack-evidence' }}
          path: |
            ${{ runner.temp }}/live-stack/**/*.jsonl
            ${{ runner.temp }}/live-stack/**/*.log
            ${{ runner.temp }}/live-stack/**/*.png
            ${{ runner.temp }}/live-junit.xml
            ${{ runner.temp }}/exp01-stack/**/*.json
            ${{ runner.temp }}/exp01-stack/**/*.jsonl
            ${{ runner.temp }}/exp01-stack/**/*.log
            ${{ runner.temp }}/exp01-stack/**/semantic-status.xml
            ${{ runner.temp }}/exp01-stack/**/SHA256SUMS
            ${{ runner.temp }}/exp01-manifest.json
            ${{ runner.temp }}/exp01-junit.xml
            ${{ runner.temp }}/exp01-outcomes.json
            ${{ runner.temp }}/exp01-report.json
            ${{ runner.temp }}/exp01-SHA256SUMS
          if-no-files-found: ${{ startsWith(inputs.test_scope, 'exp0') && 'error' || 'ignore' }}
          retention-days: 14
