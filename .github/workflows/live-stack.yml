name: Live stack

on:
  workflow_dispatch:
    inputs:
      merchant_ref:
        description: Merchant branch or commit (empty uses its default branch)
        required: false
        type: string
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: live-stack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  merchant-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      available: ${{ steps.token.outputs.available }}
    steps:
      # The Merchant is private and lives in another organization; without a read-only
      # token the live job is skipped with a notice instead of failing.
      - name: Check Merchant read token
        id: token
        env:
          MERCHANT_REPO_TOKEN: ${{ secrets.MERCHANT_REPO_TOKEN }}
        run: |
          if [ -n "$MERCHANT_REPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live stack skipped::Secret MERCHANT_REPO_TOKEN is not configured. Add a read-only token for Tesis-Agentes-Comerciales/tesis-commerce-merchant to run tests/integration."
          fi

  live-stack:
    needs: merchant-access
    if: needs.merchant-access.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout buyer agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: agent
          persist-credentials: false

      - name: Checkout merchant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tesis-Agentes-Comerciales/tesis-commerce-merchant
          ref: ${{ inputs.merchant_ref }}
          token: ${{ secrets.MERCHANT_REPO_TOKEN }}
          path: merchant
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          (cd agent && uv python install && uv sync --frozen --all-groups)
          (cd merchant && uv python install && uv sync --frozen --all-groups)

      # Disposable PostgreSQL in Docker, the real Merchant and the Agent; see
      # tests/integration/README.md.
      - name: Run live stack suite
        working-directory: agent
        env:
          RUN_LIVE_STACK: "1"
          MERCHANT_REPO: ${{ github.workspace }}/merchant
        run: uv run pytest tests/integration -rs -p no:cacheprovider --basetemp="$RUNNER_TEMP/live-stack"
