name: Joint ACP end-to-end

on:
  workflow_dispatch:
    inputs:
      merchant_repository:
        description: Merchant repository with the delegated-payment integration
        required: true
        type: string
      merchant_ref:
        description: Merchant commit or branch to test
        required: true
        type: string
      payment_repository:
        description: Independent payment-provider repository
        required: true
        type: string
      payment_ref:
        description: Payment-provider commit or branch to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: joint-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  joint-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: tesis_dev
          POSTGRES_PASSWORD: tesis_local_only
          POSTGRES_DB: tesis_lab
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U tesis_dev -d tesis_lab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout buyer agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: agent
          persist-credentials: false

      - name: Checkout merchant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.merchant_repository }}
          ref: ${{ inputs.merchant_ref }}
          path: merchant
          persist-credentials: false

      - name: Checkout payment provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.payment_repository }}
          ref: ${{ inputs.payment_ref }}
          path: payment
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python and buyer dependencies
        working-directory: agent
        run: |
          uv python install
          uv sync --frozen --all-groups

      - name: Run joint integration
        working-directory: agent
        env:
          DATABASE_URL: postgresql://tesis_dev:tesis_local_only@127.0.0.1:55433/tesis_lab
        run: >-
          uv run python scripts/run_joint_e2e.py
          --merchant-repo ../merchant
          --payment-repo ../payment
          --skip-postgres-start
