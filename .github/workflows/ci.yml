name: Validate buyer agent

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --frozen --all-groups

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Verify
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest
          uv build

      - name: Verify UI
        working-directory: ui
        run: |
          npm run lint
          npm run build
          # The opt-in governance monitor must stay out of the default build.
          if grep -rqE "governance-monitor/[0-9]+" dist; then echo "Governance monitor bundled without VITE_GOVERNANCE_MONITOR=true"; exit 1; fi
          npm run test
