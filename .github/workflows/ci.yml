name: Validate buyer agent

# Layers 1, 3 and the dry-run part of 5 on every PR (docs/testing.md). The live system
# suite (layer 4) runs in nightly.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --frozen --all-groups

      - name: Format, lint and types
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright

      - name: Build
        run: |
          uv build
          # The evaluation workspace member never ships inside the product wheel.
          if unzip -l dist/*.whl | grep -q "commerce_evaluation/"; then echo "commerce_evaluation leaked into the wheel"; exit 1; fi

  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --frozen --all-groups

      # Live tests (tests/integration) are collected and skipped: RUN_LIVE_STACK is unset.
      - name: Tests with coverage
        run: |
          uv run pytest --cov --cov-report=term \
            --junitxml=.local/p0/python-junit.xml \
            -p commerce_evaluation.p0_pytest_report \
            --p0-report=.local/p0/python-outcomes.json

      # The floor holds the product (src/), 4 points under its 2026-10-20 baseline (89.1 %);
      # evaluation/ is reported but not held to it. See docs/testing.md.
      - name: Product coverage floor
        run: uv run coverage report --include="src/*" --format=total --fail-under=85

      # Layer 5 entrypoints end to end with FakeTransport and no network; outputs stay in .local/.
      - name: Evaluation dry-runs
        run: |
          uv run hnp-matrix --dry-run --env-file .env.example
          uv run governance-pilot --dry-run

      # These reports never turn skipped live tests into integration validation.
      - name: P0 execution summary
        if: ${{ !cancelled() }}
        env:
          P0_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          P0_ACTIONS_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # Append the diagnostic even if evidence validation fails; retain that failure.
          status=0
          uv run python -m commerce_evaluation.scenarios_p0 \
            --pytest-report .local/p0/python-outcomes.json \
            --junit .local/p0/python-junit.xml \
            --output .local/p0/report.json \
            --summary .local/p0/summary.md || status=$?
          if [ -f .local/p0/summary.md ]; then
            cat .local/p0/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload Python test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-test-evidence
          path: |
            .local/p0/python-junit.xml
            .local/p0/python-outcomes.json
            .local/p0/report.json
            .local/p0/summary.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Cobertura Python: producto $(uv run coverage report --include='src/*' --format=total)%, total $(uv run coverage report --format=total)%"
            echo
            echo "<details><summary>Por archivo</summary>"
            echo
            uv run coverage report --format=markdown --skip-covered --skip-empty
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: auth
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: auth/package-lock.json

      - name: Install auth dependencies
        run: npm ci

      # Sign-up, session and a JWKS-verifiable buyer token against the real server.
      - name: Auth tests
        run: npm test

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      # Interaction and a11y tests run the stories in Chromium through the UI's own pinned
      # Playwright; --no-install never fetches an unpinned one.
      - name: Install Chromium for Playwright
        run: npx --no-install playwright install --with-deps chromium

      - name: Storybook interaction tests
        run: npm run test-storybook

      # Chat journeys against the built UI with mocked backends; no services.
      - name: Playwright E2E
        run: npm run e2e
