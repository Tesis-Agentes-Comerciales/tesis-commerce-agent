[project]
name = "tesis-commerce-evaluation"
version = "0.1.0"
description = "Experiments and evaluation harnesses for the buyer agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=2.8,<3",
  "cryptography>=46,<47",
  "httpx>=0.28,<1",
  "jwcrypto>=1.5,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.2,<2",
  "tesis-commerce-agent",
]

[project.scripts]
evaluate-conversation = "commerce_evaluation.conversation:main"
demo-stack = "commerce_evaluation.demo_stack:main"
eval-suite = "commerce_evaluation.suite.cli:main"
verify-evidence = "commerce_evaluation.verify_evidence:main"

[tool.uv.sources]
tesis-commerce-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_evaluation"]
