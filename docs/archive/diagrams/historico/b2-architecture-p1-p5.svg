<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura del agente comprador B2</title>
  <desc id="desc">Vista C4 simplificada que conserva el flujo B0 y añade estado confiable, política OPA, vigencia de oferta y evidencia.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.heading{font-size:27px;font-weight:700;fill:#333333}.section{font-size:19px;font-weight:700;fill:#333333}
      .name{font-size:20px;font-weight:700;fill:#333333}.type{font-size:14px;font-weight:400;fill:#686868}
      .description{font-size:16px;font-weight:400;fill:#555555}.edge-label{font-size:15px;font-weight:400;fill:#333333}
      .boundary{fill:none;stroke:#336C96;stroke-width:2.5;stroke-dasharray:12 8}
      .internal{fill:#FFFFFF;stroke:#336C96;stroke-width:2.5}.buyer{fill:#FFFFFF;stroke:#3C7549;stroke-width:2.5}
      .merchant{fill:#FFFFFF;stroke:#A96628;stroke-width:2.5}.approval{fill:#FFFFFF;stroke:#A96628;stroke-width:2.5}
      .edge{fill:none;stroke:#767676;stroke-width:2.1;stroke-dasharray:9 8;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 11 8" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L0 8 L11 4 Z" fill="#767676"/></marker>
  </defs>

  <rect width="1600" height="980" fill="#FFFFFF"/>
  <text x="70" y="58" class="heading">Arquitectura del agente comprador B2</text>
  <text x="70" y="88" class="description">B0 se conserva; B2 añade decisión verificable, vigencia de oferta y evidencia.</text>

  <rect x="205" y="120" width="1165" height="790" class="boundary"/>
  <text x="230" y="157" class="section">API del agente · variante B2</text>

  <circle cx="92" cy="414" r="38" class="buyer"/>
  <rect x="28" y="452" width="128" height="104" rx="34" class="buyer"/>
  <text x="92" y="488" text-anchor="middle" class="name">Comprador</text>
  <text x="92" y="514" text-anchor="middle" class="description">Solicita</text>
  <text x="92" y="536" text-anchor="middle" class="description">y aprueba</text>

  <rect x="1415" y="417" width="155" height="112" rx="10" class="merchant"/>
  <text x="1492" y="459" text-anchor="middle" class="name">Comercio</text>
  <text x="1492" y="486" text-anchor="middle" class="description">Catálogo,</text>
  <text x="1492" y="508" text-anchor="middle" class="description">checkout y orden</text>

  <text x="235" y="213" class="section">Flujo B0 conservado</text>
  <rect x="270" y="240" width="245" height="112" rx="10" class="internal"/>
  <text x="392" y="278" text-anchor="middle" class="name">Interfaz del agente</text>
  <text x="392" y="304" text-anchor="middle" class="type">[Contenedor]</text>
  <text x="392" y="330" text-anchor="middle" class="description">Chat y aprobación</text>

  <rect x="660" y="240" width="245" height="112" rx="10" class="internal"/>
  <text x="782" y="278" text-anchor="middle" class="name">LangGraph</text>
  <text x="782" y="304" text-anchor="middle" class="type">[Componente]</text>
  <text x="782" y="330" text-anchor="middle" class="description">Conduce cada turno</text>

  <rect x="1050" y="240" width="245" height="112" rx="10" class="internal"/>
  <text x="1172" y="278" text-anchor="middle" class="name">Modelo + filtros</text>
  <text x="1172" y="304" text-anchor="middle" class="type">[Componentes B0]</text>
  <text x="1172" y="330" text-anchor="middle" class="description">Propone entre elegibles</text>

  <text x="235" y="420" class="section">Gobernanza B2 añadida</text>
  <rect x="270" y="448" width="245" height="118" rx="10" class="internal"/>
  <text x="392" y="484" text-anchor="middle" class="name">Trusted State</text>
  <text x="392" y="510" text-anchor="middle" class="type">[Componente B2]</text>
  <text x="392" y="536" text-anchor="middle" class="description">Estado tipado y procedencia</text>

  <rect x="660" y="448" width="245" height="118" rx="10" class="internal"/>
  <text x="782" y="484" text-anchor="middle" class="name">Policy Gateway</text>
  <text x="782" y="510" text-anchor="middle" class="type">[Componente B2]</text>
  <text x="782" y="536" text-anchor="middle" class="description">Allow · deny · ask</text>

  <rect x="1050" y="448" width="245" height="118" rx="10" class="internal"/>
  <text x="1172" y="484" text-anchor="middle" class="name">OPA / Rego v1</text>
  <text x="1172" y="510" text-anchor="middle" class="type">[Motor de política B2]</text>
  <text x="1172" y="536" text-anchor="middle" class="description">Default deny · bundle hash</text>

  <text x="235" y="636" class="section">Efecto y evidencia</text>
  <rect x="270" y="665" width="245" height="118" rx="10" class="internal"/>
  <text x="392" y="701" text-anchor="middle" class="name">OfferFreshnessGuard</text>
  <text x="392" y="727" text-anchor="middle" class="type">[Componente B2]</text>
  <text x="392" y="753" text-anchor="middle" class="description">Revisión, expiración y huella</text>

  <rect x="660" y="665" width="245" height="118" rx="10" class="approval"/>
  <text x="782" y="701" text-anchor="middle" class="name">Aprobación AP2</text>
  <text x="782" y="727" text-anchor="middle" class="type">[Componente B0]</text>
  <text x="782" y="753" text-anchor="middle" class="description">Firma tras consentimiento</text>

  <path d="M1050 683 C1050 665 1295 665 1295 683 L1295 769 C1295 788 1050 788 1050 769 Z" class="internal"/>
  <ellipse cx="1172" cy="683" rx="122" ry="18" class="internal"/>
  <text x="1172" y="713" text-anchor="middle" class="name">Decision Evidence</text>
  <text x="1172" y="739" text-anchor="middle" class="type">[SQLite · B2]</text>
  <text x="1172" y="763" text-anchor="middle" class="description">Razones, digest y latencia</text>

  <path d="M156 476 H205 V296 H260" class="edge"/>
  <text x="170" y="283" class="edge-label">HTTPS</text>
  <path d="M515 296 H650" class="edge"/>
  <text x="560" y="282" class="edge-label">SSE</text>
  <path d="M905 296 H1040" class="edge"/>
  <text x="936" y="282" class="edge-label">solicitud</text>

  <path d="M1172 352 V390 H392 V438" class="edge"/>
  <text x="688" y="381" class="edge-label">intención, candidatos y selección</text>
  <path d="M515 507 H650" class="edge"/>
  <text x="541" y="493" class="edge-label">PolicyInput</text>
  <path d="M905 507 H1040" class="edge"/>
  <text x="942" y="493" class="edge-label">Rego</text>

  <path d="M1415 473 H1340 V620 H392 V655" class="edge"/>
  <text x="1165" y="607" class="edge-label">checkout vigente</text>
  <path d="M392 665 V610 H782 V576" class="edge"/>
  <text x="455" y="599" class="edge-label">revisión y huella</text>
  <path d="M782 566 V655" class="edge"/>
  <text x="796" y="623" class="edge-label">allow</text>
  <path d="M905 724 H1040" class="edge"/>
  <text x="928" y="709" class="edge-label">registra</text>
  <path d="M905 773 V818 H1385 V529 H1405" class="edge"/>
  <text x="1035" y="806" class="edge-label">mandato AP2 + token</text>

  <text x="235" y="866" class="description">P1 intención · P2 selección · P3 checkout · P4 aprobación · P5 completion</text>
  <text x="1350" y="866" text-anchor="end" class="description">Cajas blancas · bordes por responsabilidad · relaciones grises</text>
</svg>
